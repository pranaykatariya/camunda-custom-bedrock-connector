CONNECTOR_AI_AGENT_TYPE: ${BARCLAYS_AI_AGENT_TASK_TYPE:barclays.ai-gateway:aiagent:1}
CONNECTOR_AI_AGENT_JOB_WORKER_TYPE: ${BARCLAYS_AI_AGENT_SUBPROCESS_TYPE:barclays.ai-gateway:aiagent-job-worker:1}

camunda:
  connector:
    agenticai:
      ad-hoc-tools-schema-resolver:
        enabled: false
      mcp:
        remote-client:
          enabled: false
      a2a:
        client:
          outbound:
            enabled: false
          polling:
            enabled: false
          webhook:
            enabled: false
          agentic:
            tool:
              enabled: false

barclays:
  ai-gateway:
    auth:
      enabled: ${BARCLAYS_AI_GATEWAY_AUTH_ENABLED:true}
      token:
        header-name: ${BARCLAYS_AI_GATEWAY_TOKEN_HEADER:x-bam-token}
        header-value-template: "${BARCLAYS_AI_GATEWAY_TOKEN_HEADER_TEMPLATE:{token}}"
      static-headers:
        - name: Accept
          value: application/json
        # Placeholder: set BARCLAYS_AI_GATEWAY_HOST_HEADER to the host the gateway routes on.
        - name: Host
          value: ${BARCLAYS_AI_GATEWAY_HOST_HEADER:bedrock-gateway.placeholder.invalid}
      bam:
        token-url: ${BARCLAYS_AI_BAM_TOKEN_URL:}
        username: ${BARCLAYS_AI_BAM_USERNAME:}
        password: ${BARCLAYS_AI_BAM_PASSWORD:}

logging:
  pattern:
    # Spring Boot's default pattern ends in %m; %kvp is what emits this project's structured log fields.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p){} %clr(${PID:- }){magenta} %clr(--- [%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp%n%wEx"
