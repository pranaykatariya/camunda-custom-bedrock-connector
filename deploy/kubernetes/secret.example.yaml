# EXAMPLE ONLY - do not commit real values. Create the secret out-of-band, e.g.
#   kubectl create secret generic org-ai-agent-runtime \
#     --from-literal=ORG_AI_CLIENT_SECRET=... --from-literal=CAMUNDA_CLIENT_AUTH_CLIENTSECRET=...
# or sync it from your secret manager (External Secrets Operator, Vault Agent, CSI driver).
apiVersion: v1
kind: Secret
metadata:
  name: org-ai-agent-runtime
type: Opaque
stringData:
  # Only for ORG_AI_GATEWAY_AUTH_MODE=OAUTH2_CLIENT_CREDENTIALS
  ORG_AI_CLIENT_ID: "<client id>"
  ORG_AI_CLIENT_SECRET: "<client secret>"
  CAMUNDA_CLIENT_AUTH_CLIENTID: "<camunda api client id>"
  CAMUNDA_CLIENT_AUTH_CLIENTSECRET: "<camunda api client secret>"
